# ==============================================================================
# PAPATYALAR PLATFORMU - NGINX PRODUCTION CONFIG
# Domain: papatyalar.com & www.papatyalar.com -> Node/Next.js: 127.0.0.1:3041
# ==============================================================================

# 1. HTTP -> HTTPS Yönlendirmesi
server {
    listen 80;
    listen [::]:80;
    server_name papatyalar.com www.papatyalar.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://papatyalar.com$request_uri;
    }
}

# 2. www -> non-www HTTPS Yönlendirmesi (SEO Canonical Bütünlüğü)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.papatyalar.com;

    ssl_certificate /etc/letsencrypt/live/papatyalar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/papatyalar.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://papatyalar.com$request_uri;
}

# 3. Ana HTTPS Sunucu Bloğu (papatyalar.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name papatyalar.com;

    ssl_certificate /etc/letsencrypt/live/papatyalar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/papatyalar.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Gzip Sıkıştırma (Hızlı yükleme ve Core Web Vitals)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3041;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 502 Hatalarını Önleyen Buffer Ayarları
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }
}
